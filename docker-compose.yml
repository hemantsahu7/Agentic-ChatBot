services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    # Bind-mounted (not a named volume) so chatbot.db and faiss_db live
    # directly on the host and survive every redeploy/rebuild.
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
